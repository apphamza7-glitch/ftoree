{% extends "dashboard/base.html" %}

{% block title %}Delete Category{% endblock %}
{% block page_title %}Delete Category{% endblock %}

{% block content %}
<div class="dash-panel dash-panel--form">
    <p>Are you sure you want to delete <strong>{{ category.name }}</strong>? This cannot be undone.</p>

    <form method="post" class="dash-form-actions">
        {% csrf_token %}
        <a href="{% url 'dashboard:category_list' %}" class="dash-btn-secondary">Cancel</a>
        <button type="submit" class="dash-btn-danger">Delete Category</button>
    </form>
</div>
{% endblock %}
