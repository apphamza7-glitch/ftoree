{% extends "dashboard/base.html" %}

{% block title %}Delete Tag{% endblock %}
{% block page_title %}Delete Tag{% endblock %}

{% block content %}
<div class="dash-panel dash-panel--form">
    <p>Are you sure you want to delete <strong>{{ tag.name }}</strong>?</p>

    <form method="post" class="dash-form-actions">
        {% csrf_token %}
        <a href="{% url 'dashboard:tag_list' %}" class="dash-btn-secondary">Cancel</a>
        <button type="submit" class="dash-btn-danger">Delete Tag</button>
    </form>
</div>
{% endblock %}
