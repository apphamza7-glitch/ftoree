{% load static %}
<header class="site-header">
    <div class="header-top container">
        <a href="{% url 'shop:home' %}" class="brand">
            <span class="brand-mark">Nova</span><span class="brand-type">Market</span>
        </a>

        <form action="{% url 'shop:product_list' %}" method="get" class="search-form">
            <span class="search-prefix mono">/find</span>
            <input type="text" name="q" placeholder="Search products, brands, categories…" class="search-input" value="{{ request.GET.q }}">
            <button type="submit" class="search-btn">Search</button>
        </form>

        <div class="header-actions">
            <a href="#" class="header-icon-link">Wishlist</a>
            <a href="{% url 'shop:cart_detail' %}" class="header-icon-link">Cart <span class="mono">({{ cart_item_count }})</span></a>
            {% if user.is_authenticated %}
                <a href="#" class="header-icon-link header-icon-link--user">{{ user.username }}</a>
            {% else %}
                <a href="#" class="header-icon-link header-icon-link--user">Login</a>
            {% endif %}
        </div>
    </div>

    <nav class="main-nav">
        <div class="container nav-inner">
            <ul class="nav-list">
                <li><a href="{% url 'shop:home' %}">Home</a></li>
                <li><a href="{% url 'shop:product_list' %}">All Products</a></li>
                <li><a href="#">Deals</a></li>
                <li><a href="#">Digital</a></li>
            </ul>
        </div>
    </nav>
</header>
